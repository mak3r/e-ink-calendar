name: Close Linked Issues

on:
  pull_request:
    types: [closed]
    branches:
      - develop
      # Also add 'main' here if your project merges directly to main without a develop branch

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close linked issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          matches=$(echo "$PR_BODY" | grep -oiE '(closes|fixes|resolves) #[0-9]+' | grep -oE '[0-9]+' || true)

          if [ -z "$matches" ]; then
            echo "No \`Closes/Fixes/Resolves #N\` found in PR #${PR_NUMBER}'s body - no issues closed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Issues closed by PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
            echo "$matches" | while read -r num; do
              [ -z "$num" ] && continue
              echo "Closing issue #$num"
              echo "- #$num" >> "$GITHUB_STEP_SUMMARY"
              gh issue close "$num" --repo "$REPO" \
                --comment "Closed automatically: fixed by PR #${PR_NUMBER} merged to develop." || true
            done
          fi

          # Flag any bare #N reference that has no recognized closing keyword next to
          # it - usually a typo'd issue number or keyword (e.g. "Closes #21" vs "#214").
          all_refs=$(echo "$PR_BODY" | grep -oE '#[0-9]+' | grep -oE '[0-9]+' | sort -u || true)
          orphaned=""
          for ref in $all_refs; do
            if ! echo "$matches" | grep -qx "$ref"; then
              orphaned="$orphaned #$ref"
            fi
          done
          if [ -n "$orphaned" ]; then
            echo "::warning::PR #${PR_NUMBER} body references${orphaned} without a recognized closing keyword (Closes/Fixes/Resolves) - check for a typo in the issue number or keyword."
            echo "### ⚠️ Unclosed references in PR #${PR_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
            echo "Found${orphaned} with no recognized closing keyword nearby - check for a typo." >> "$GITHUB_STEP_SUMMARY"
          fi
