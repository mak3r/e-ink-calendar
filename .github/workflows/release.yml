name: Release

# Tag-triggered release pipeline.
# Push a v* tag to main to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The workflow runs `make test` and `make quality` as a final gate. If either
# fails, no GitHub Release is published. On success it creates a Release for the
# tag with auto-generated notes.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of main. Releases are cut from main only."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          for req in requirements.txt requirements-dev.txt; do
            [ -f "$req" ] && pip install -r "$req"
          done
          true

      - name: Test gate
        run: make test

      - name: Quality gate
        run: make quality

  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
