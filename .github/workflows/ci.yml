name: CI

on:
  push:
    branches: [main, develop, "feature/**", "persona/**"]
  pull_request:
    branches: [main, develop]

# Language-agnostic CI. All jobs call Makefile targets.
# To add language setup (e.g. Go, Node, Python), add the appropriate
# setup step before the make call in the relevant job.
# Example for Go: add "uses: actions/setup-go@v5 with: {go-version-file: go.mod}"
# Example for Node: add "uses: actions/setup-node@v4 with: {node-version: '22'}"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Raspberry Pi OS Bookworm; 3.13 = Trixie-era images (issue #66).
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-base.txt -r requirements-dev.txt

      - name: Build
        run: make build

      - name: Test
        run: make test

  # Aggregate gate with a stable name. Branch protection on develop & main
  # requires the "build-and-test" context; the matrix legs above report as
  # "test (3.11)" / "test (3.13)", so this job fans them in under the required
  # name (issue #71). `if: always()` + the explicit result check keeps a failed
  # matrix from passing the gate via a skipped job.
  build-and-test:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the test matrix to have succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::test matrix result was '${{ needs.test.result }}'"
            exit 1
          fi

  lint:
    # Skip on direct pushes to feature/persona branches — the pull_request event covers those.
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # required for diff-aware linters

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-base.txt -r requirements-dev.txt

      - name: Lint
        run: make lint

  quality:
    # Skip on direct pushes to feature/persona branches — the pull_request event covers those.
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-base.txt -r requirements-dev.txt bandit mypy

      - name: Quality checks
        run: make quality
