# Copy this file to config/config.yaml (or a location outside the repo checkout,
# e.g. ~/.config/eink-calendar/config.yaml — see docs/architecture.md) and fill
# in real values. config.yaml itself is gitignored and must never be committed.
#
# The dev Mac and the Pi each keep their OWN config.yaml — see the
# "Per-environment config" section of docs/architecture.md. Every key below is
# marked:
#   # ENV-SPECIFIC            — expected to differ between dev and Pi
#   # SHARED — keep identical  — must be kept in sync by hand across both

display:
  driver: mock            # ENV-SPECIFIC  ("inky" on the Pi, "mock" on the dev Mac)
  # ENV-SPECIFIC. Where every rendered frame is archived (both drivers) for
  # pull_preview.sh and design review. A relative path is resolved against the
  # working directory: in the dev loop that's the repo root (-> <repo>/data/),
  # and under systemd it's the ~/app checkout (-> ~/app/data/, which is what
  # pull_preview.sh and the runbook expect). Set an absolute path to override.
  output_path: "data/last_render.png"
  mock_auto_open: true     # ENV-SPECIFIC  (no effect under the "inky" driver)
  resolution: [800, 480]   # ENV-SPECIFIC  (confirm against inky.auto().resolution during Pi bring-up)

refresh:                   # SHARED — keep identical
  daily_time: "05:30"
  timezone: "America/New_York"

view:                      # SHARED — keep identical
  default: day
  week_starts_on: monday
  # day_max_entries: 9      # 5-9, caps day-view cards before overflow (default 9)

buttons:
  pin_map: {A: 5, B: 6, C: 16, D: 24}   # ENV-SPECIFIC  (confirm against Pimoroni's current pinout docs during Pi bring-up)
  bindings: {A: cycle_view, B: force_refresh, C: noop, D: noop}  # SHARED — keep identical  (D reserved for future settings menu)

accounts:                  # SHARED — keep identical
  - name: personal
    credentials_file: "~/.config/eink-calendar/personal_credentials.json"
    token_file: "~/.config/eink-calendar/personal_token.json"
    calendars:
      - {id: "primary", label: "Example", color: red}
      # - {id: "family01234@group.calendar.google.com", label: "Family", color: blue}
  # a second `accounts` entry is how a future second Google account gets added — no code change needed

cache:
  path: "data/cache.json"  # SHARED — keep identical
